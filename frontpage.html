<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinko Kusina</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Pacifico&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background-image: url("bgmenu.png");
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
        }

        nav {
            width: 100%;
            padding: 18px 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: transparent;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 20;
        }

        .logo {
            font-size: 3.5rem;
            font-weight: 700;
            font-family: "Caveat Brush";
            letter-spacing: 2px;
            color: white;
            text-shadow: 0px 2px 6px rgba(0,0,0,0.5);
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 40px;
            margin: 0;
        }

        nav ul li a {
            text-decoration: none;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            transition: 0.3s;
            position: relative;
        }

        nav ul li a:hover {
            color: #56df7f;
        }

        nav ul li a::after {
            content: "";
            position: absolute;
            width: 0%;
            height: 2px;
            left: 0;
            bottom: -3px;
            background: #56df7f;
            transition: 0.3s ease-in-out;
        }

        nav ul li a:hover::after {
            width: 100%;
        }

        .hero {
            height: 100vh;
            width: 100%;
            background-image: url("hero-burger.jpg");
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .hero-title {
            font-size: 6rem;
            font-family: "Pacifico", cursive;
            color: white;
            text-shadow: 0px 2px 8px rgba(0,0,0,0.5);
        }

        .contact-btn {
            position: absolute;
            top: 90px;
            right: 35px;
            background: white;
            padding: 12px 28px;
            border-radius: 30px;
            box-shadow: 0px 3px 6px rgba(0,0,0,0.3);
            color: #333;
            text-decoration: none;
            font-weight: 600;
            z-index: 30;
            transition: 0.2s;
        }

        .contact-btn:hover {
            background: #56df7f;
            color: white;
        }
    </style>
</head>

<body>

    <nav>
        <label class="logo">Cinko Kusina</label>

        <ul>
            <li><a href="Menu.html">View Menu</a></li>
            <li><a href="aboutpage.html">About Us</a></li>
            <li><a href="reservation.html">Reserve Now</a></li>
        </ul>
    </nav>

    <a href="#" class="contact-btn" data-bs-toggle="modal" data-bs-target="#contactModal">
        Contact Us
    </a>

    <section class="hero">
        <h1 class="hero-title">Bringing Family Recipes to Life</h1>
    </section>

    <div class="modal fade" id="contactModal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="border-radius: 20px;">
                <div class="modal-header" style="background:#dfc1a3;">
                    <h5 class="modal-title">Contact Information</h5>
                    <button class="btn-close" data-bs-dismiss="modal"></button>
                </div>

                <div class="modal-body">
                    <p><strong>📞 Number:</strong> 0912 345 6789</p>
                    <p><strong>📧 Email:</strong> cinkokusina@gmail.com</p>
                </div>

                <div class="modal-footer">
                    <a href="reservation.html" class="btn btn-success">Reserve Now</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
