<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinko Kusina Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="design_reservation.css">
</head>

<body>

<a href="frontpage.html" class="prevbtn"> ← </a>

<nav class="navbar navbar-expand-sm navbar-dark fixed-top navbar-scrolled">
    <div class="head-container">
        <!-- logo -->
        <img src="cklogo.jpg" class="logo" alt="Cinko Logo">

        <h1 class="h1">CINKO</h1>
        <h2 class="h2">KUSINA</h2>
    </div>
</nav>

<!-- PAGE LOADER OVERLAY -->
<div id="pageLoader" aria-hidden="true">
    <div class="loader-inner">
        <!-- Using Bootstrap spinner for accessibility and familiarity -->
        <div class="spinner-border" role="status" aria-hidden="true"></div>
        <div class="loader-text">Processing reservation...</div>
    </div>
</div>

<div class="center-panel">
<form class="reservation-form" id="reservationForm">

<table class="reservation" cellpadding="10" cellspacing="9" style="width:100%;">

    <tr>
        <td>Customer Name:</td>
        <td>
            <div class="form-floating mb-3">
                <input type="text" class="form-control" id="floatingName" placeholder="Your Name" required>
                <label for="floatingName">Name</label>
            </div>
        </td>
    </tr>

    <tr>
        <td>Email:</td>
        <td>
            <div class="form-floating mb-3">
                <input type="email" class="form-control" id="floatingEmail" placeholder="name@example.com" required>
                <label for="floatingEmail">email@gmail.com</label>
            </div>
        </td>
    </tr>

    <tr>
        <div class="dropdown mb-3">
    <label>Time</label>
    <button class="form-select dropdown-toggle" type="button" data-bs-toggle="dropdown">
        Select Time
    </button>
    <ul class="dropdown-menu w-100">
        <li><a class="dropdown-item" href="#">10:00 AM</a></li>
        <li><a class="dropdown-item" href="#">11:00 AM</a></li>
        <li><a class="dropdown-item" href="#">12:00 PM</a></li>
        <li><a class="dropdown-item" href="#">1:00 PM</a></li>
        <li><a class="dropdown-item" href="#">2:00 PM</a></li>
        <li><a class="dropdown-item" href="#">3:00 PM</a></li>
    </ul>
</div>
    </tr>

    <tr>
        <td>Date:</td>
        <td><input type="date" class="form-control" id="reserveDate" required></td>
    </tr>

    <tr>
       <div class="dropdown mb-3">
    <label>Quantity</label>
    <button class="form-select dropdown-toggle" type="button" data-bs-toggle="dropdown">
        Select Quantity
    </button>
    <ul class="dropdown-menu w-100">
        <li><a class="dropdown-item" href="#">1</a></li>
        <li><a class="dropdown-item" href="#">2</a></li>
        <li><a class="dropdown-item" href="#">3</a></li>
        <li><a class="dropdown-item" href="#">4</a></li>
        <li><a class="dropdown-item" href="#">5</a></li>
        <li><a class="dropdown-item" href="#">6+</a></li>
    </ul>
</div>

    </tr>

</table>

<div class="text-center mt-3">
    <button class="reservebtn" type="submit" id="reserveBtn">RESERVE NOW</button>
</div>

</form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // keep the same navbar scroll behavior you had
    const navbar = document.querySelector(".navbar");
    window.addEventListener("scroll", ()=> {
        if (window.scrollY >= 30) {
            navbar.classList.add("navbar-scrolled");
        } else {
            navbar.classList.remove("navbar-scrolled");
        }
    });

    // Loader + submission behavior
    const form = document.getElementById('reservationForm');
    const loader = document.getElementById('pageLoader');

    form.addEventListener('submit', function(e) {
        e.preventDefault();

        // Show full-page loader
        loader.style.display = 'flex';
        loader.setAttribute('aria-hidden', 'false');

        // simulate processing time (2 seconds). Replace with real request as needed.
        setTimeout(function() {
            loader.style.display = 'none';
            loader.setAttribute('aria-hidden', 'true');

            // Success message
            alert("Reservation Successful! Just wait for a call from one of the founders.");

            // Optionally: reset form or redirect
            form.reset();
        }, 2000);
    });
document.querySelectorAll(".dropdown").forEach(drop => {
    const button = drop.querySelector(".dropdown-toggle");
    const items = drop.querySelectorAll(".dropdown-item");

    items.forEach(item => {
        item.addEventListener("click", function (e) {
            e.preventDefault();
            button.textContent = this.textContent;  // Show selected text
            button.dataset.value = this.textContent; // Save selected value
        });
    });
});

</script>


</body>
</html>
